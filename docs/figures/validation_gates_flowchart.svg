<rect class="ok" x="90" y="370" width="280" height="65"/><text class="t" x="230" y="397"><tspan>trajectories → transitions</tspan><tspan x="230" dy="20">→ area trend with CIs</tspan></text><rect class="no" x="530" y="370" width="280" height="65"/><text class="t" x="670" y="397"><tspan class="b">STOP.</tspan><tspan x="670" dy="20">write up the negative result</tspan></text><path class="line" d="M410 305L280 370"/><text class="lab" x="335" y="340">all pass</text><path class="line" d="M490 305L620 370"/><text class="lab" x="565" y="340">S4 or S5 fails</text>
