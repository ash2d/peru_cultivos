<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172033}.box{fill:#eef4fb;stroke:#416788;stroke-width:2;rx:10}.ok{fill:#eaf6ee;stroke:#3d8052;stroke-width:2;rx:10}.no{fill:#fff0f0;stroke:#a33a3a;stroke-width:2;rx:10}.t{font-size:16px;text-anchor:middle}.b{font-weight:bold}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.lab{font-size:14px;fill:#475569;text-anchor:middle}</style>
<rect class="box" x="300" y="20" width="300" height="70"/><text class="t" x="450" y="48"><tspan class="b">panel_predictions.parquet</tspan><tspan x="450" dy="22">215,320 parcel-years</tspan></text>
<rect class="box" x="40" y="135" width="240" height="80"/><text class="t" x="160" y="164"><tspan class="b">S4 — temporal transfer</tspan><tspan x="160" dy="22">does the model work k years</tspan><tspan x="160" dy="19">from the label year?</tspan></text>
