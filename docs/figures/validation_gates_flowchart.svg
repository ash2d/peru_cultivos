<rect class="box" x="620" y="135" width="240" height="80"/><text class="t" x="740" y="164"><tspan class="b">El Niño confound</tspan><tspan x="740" dy="22">does 1998 imagery</tspan><tspan x="740" dy="19">break the model?</tspan></text>
