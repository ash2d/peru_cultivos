[project]
name = "crop-classifier"
version = "0.1.0"
description = "Crop classifier from satellite imagery, with GEE integration and legacy-dataset analysis for train/test set construction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contextily>=1.7.1",
    "earthengine-api>=1.7.34",
    "geemap>=0.37.2",
    "geopandas>=1.1.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "pyproj>=3.7.2",
    "pyreadstat>=1.3.5",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.4",
    "rioxarray>=0.19.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "statsmodels>=0.14.6",
    "torch>=2.13.0",
    "typer>=0.27.0",
    "xarray>=2026.7.0",
]

# `uv run cc ...` instead of `uv run python -m crop_classifier.cli ...`
[project.scripts]
cc = "crop_classifier.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crop_classifier"]

[tool.pytest.ini_options]
markers = [
    "closed_route: guards code for an estimand that was abandoned; kept so it does not rot",
    "slow: spawns a subprocess and trains a model; skip with -m 'not slow'",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The notebooks are exploratory and historical (notebooks/README.md); linting them would
# make `ruff check .` fail on 143 pre-existing style errors in code nothing imports, which
# turns the gate into noise. `src/` and `tests/` are the code that must stay clean.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
