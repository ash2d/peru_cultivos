# 3-class label policy for the ALL-PERU workspace (docs/RESULTS.md §4).
#
# Derived from config/perennial.yaml (Piura) by ADDING tokens only — no Piura assignment is
# changed, so the two label spaces stay comparable. Every policy flag is identical.
#
# Why it was needed: the Piura lexicon covers 79,164 of 80,618 Piura records but only
# 80.8 % of the national ones. The Piura registry is a coastal-valley crop list (rice,
# mango, lime, cotton); Peru adds the sierra (potato, barley, lupin, and above all GRAZING
# LAND recorded by grass species) and the selva (coffee cultivars, cacao, oil palm).

# ⚠️ This file is a DIFF against its parent, resolved by `crop_classifier.config_loader`.
# Read the parent for anything not listed below.

