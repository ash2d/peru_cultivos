area_min_ha: 0.09       # < 1 Landsat pixel
area_max_ha: 50.0
require_year: true      # titling year trusted as-is, but must exist
year_min: 1990
year_max: 2020

# ---- abstain gate ----
min_valid_obs: 4        # n_valid_obs >= 4 -> quality_ok

# ---- D2 diagnostic: 4-class variant (PASTURE and FALLOW kept apart) ----
# Built behind this flag so the leading model can be trained on it once and collapsed
# post-hoc to 3 classes, testing whether merging two spectrally opposite classes hurt.
four_class: false
four_class_names:
  pasture: PASTURE
  fallow: FALLOW
  land_prep: FALLOW

