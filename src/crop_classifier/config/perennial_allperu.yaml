# 3-class label policy for the ALL-PERU workspace (docs/all_peru/plan.md).
#
# Derived from config/perennial.yaml (Piura) by ADDING tokens only — no Piura assignment is
# changed, so the two label spaces stay comparable. Every policy flag is identical.
#
# Why it was needed: the Piura lexicon covers 79,164 of 80,618 Piura records but only
# 80.8 % of the national ones. The Piura registry is a coastal-valley crop list (rice,
# mango, lime, cotton); Peru adds the sierra (potato, barley, lupin, and above all GRAZING
# LAND recorded by grass species) and the selva (coffee cultivars, cacao, oil palm).
#
# Original header follows.
# 3-class label policy: PERENNIAL / ANNUAL / PASTURE_FALLOW (docs/perennial/plan.md §3).
# USER-EDITABLE. `perennial labels` reads this file; the resolved token->group table is
# written to class_lexicon_resolved.csv next to the outputs.
#
# The classes proxy the research question "has land shifted from non-export to export
# crops?": perennial ~ export (mango, lime, coffee, banana, cacao, avocado), annual ~
# domestic (rice, maize, cotton, beans, wheat). They are also the three land *states* a
# 30 m Landsat year separates well: canopy all year / green-then-bare cycles / neither.

classes: [PERENNIAL, ANNUAL, PASTURE_FALLOW]
# D3 tie-break for multi-crop parcels: first listed group wins. A tree canopy dominates a
# 30 m pixel regardless of what is intercropped beneath it.
group_priority: [PERENNIAL, ANNUAL, PASTURE_FALLOW]

# ---- policy flags (docs/perennial/plan.md §2) ----
# D1: sugarcane is a multi-year ratoon crop (spectrally perennial) but is not an export
# perennial and MapBiomas classes it as a *temporary* crop. `annual` keeps our definition
# aligned with MapBiomas; §9.5 re-runs the headline trend with `perennial` as a
# sensitivity check.
cana_policy: annual                # annual | perennial
# D2: prepared bare ground is spectrally fallow, and these classes are land-state, not
# crop identity. (labels.py's 12-class policy drops land_prep instead.)
land_prep_policy: pasture_fallow   # pasture_fallow | drop
# D1: trees that look exactly like orchards but are not export crops. Folding them into
# PERENNIAL would corrupt the interpretation; there are too few (~350 records) to train a
# 4th class. Excluded from training — at inference they will be predicted PERENNIAL and
# are a known false-positive source for the export-crop reading.
woody_noncrop_policy: exclude      # exclude | perennial

# ---- resolution order for one (crop, category) token ----
# 1. woody_noncrop        -> excludes the whole parcel (if policy is `exclude`)
# 2. an explicit list below (perennial / annual / pasture_fallow)
# 3. category_default[category]   (deliberate policy for non-crop categories)
# 4. crop_fallback               (a *guess* for unlisted `crop`-category tokens; audited
#                                 in unassigned_tokens.csv and capped by
#                                 max_unassigned_frac)
category_default:
  pasture: PASTURE_FALLOW
  fallow: PASTURE_FALLOW
  land_prep: PASTURE_FALLOW      # overridden to null when land_prep_policy: drop
  unspecified: null              # null = token contributes nothing
crop_fallback: ANNUAL            # annuals dominate the unlisted tail

# `noise` maps to null: those tokens contribute nothing rather than being guessed.
# Naming the groups explicitly is required once a 4th list exists.
lexicon_groups:
  perennial: PERENNIAL
  annual: ANNUAL
  pasture_fallow: PASTURE_FALLOW
  noise: null

# Resolve a token's individual WORDS against the lexicon when the whole token misses, and
# combine them with `group_priority` exactly as a multi-crop parcel is combined. The
# national tail is 14,483 distinct tokens of free text wrapped around a recognisable crop
# ("PLANTACION DE VID", "CONTIENE RASTROJO DE MAIZ"); without this they all collapse onto
# the blanket ANNUAL guess. Audited separately as source `word_match`.
word_match: true
max_unassigned_frac: 0.02        # build fails loudly above this

# ---- growth-stage / association phrases (all-Peru only) ----
# The sierra registrars wrote the crop AND its phenological stage: "MAIZ EN FLORACION",
# "PAPA EN FASE DE CRECIMIENTO", "TREBOL EN MADURACION", "KIKUYO ASOCIADO A TREBOL". That
# is a *productive* pattern (any crop x any stage), so it cannot be enumerated in a
# lexicon: ~8 % of all national records, spread over thousands of variants. labels3
# strips these phrases and re-resolves the base token; the audit records the hit as
# `stage_stripped:<original source>` so nothing is hidden.
# Stage is irrelevant to this label space anyway: the class is the parcel's land STATE
# over a whole year, and maize-at-flowering and maize-at-harvest are the same annual crop.
stage_words:
  - FLORACION
  - CRECIMIENTO
  - COSECHA
  - MADURACION
  - PRODUCCION
  - EMERGENCIA
  - APORQUE
  - ESPIGA
  - ESPIGAMIENTO
  - SIEMBRA
  - GERMINACION
  - DESARROLLO
  - MACOLLAJE
  - PANOJA
  - GRANO
  - VERDE
  - SECO
  - CORTE
  - TRANSPLANTE
  - TRASPLANTE
  - ALMACIGO
  - BROTAMIENTO
  - FRUCTIFICACION
  - LLENADO
  - MATURACION
  - PLENA PRODUCCION
  - INICIO

