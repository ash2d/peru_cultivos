# 3-class label policy: PERENNIAL / ANNUAL / PASTURE_FALLOW (docs/PIPELINE.md §4).
# USER-EDITABLE. `perennial labels` reads this file; the resolved token->group table is
# written to class_lexicon_resolved.csv next to the outputs.
#
# The classes proxy the research question "has land shifted from non-export to export
# crops?": perennial ~ export (mango, lime, coffee, banana, cacao, avocado), annual ~
# domestic (rice, maize, cotton, beans, wheat). They are also the three land *states* a
# 30 m Landsat year separates well: canopy all year / green-then-bare cycles / neither.

# BINARY VARIANT: PASTURE_FALLOW folded into ANNUAL, leaving PERENNIAL vs NON_PERENNIAL.
# Motivation: PASTURE_FALLOW is the weakest class everywhere (test F1 0.44) and 21 % of
# parcels, so its errors bleed into the other two and can manufacture apparent transitions
# in the trend. The research question is really "export (perennial) vs not", so the third
# class may be costing accuracy without earning its keep.

# ⚠️ This file is a DIFF against its parent, resolved by `crop_classifier.config_loader`.
# Read the parent for anything not listed below.

extends: perennial.yaml

# Inherited keys this label space genuinely does not have.
drop:
- annual
- pasture_fallow

# Keys this variant sets for itself; each REPLACES the parent's.
classes:
- PERENNIAL
- NON_PERENNIAL
group_priority:
- PERENNIAL
- NON_PERENNIAL
lexicon_groups:
  perennial: PERENNIAL
  non_perennial: NON_PERENNIAL
  non_perennial_extra: NON_PERENNIAL
annual_class: NON_PERENNIAL
category_default:
  pasture: NON_PERENNIAL
  fallow: NON_PERENNIAL
  land_prep: NON_PERENNIAL
  unspecified: null
crop_fallback: NON_PERENNIAL
