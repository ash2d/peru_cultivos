# Spatial split policy for the WINDOW deliverable (docs/RESULTS.md §5).
#
# Identical to split_allperu.yaml except for the two additions §4.4 asks for. It is a
# separate file rather than an edit because split_allperu.yaml is what reproduces the
# existing national split, and that split holds an UNSPENT locked test (W-D8) which must not
# be silently redrawn.
#
#  * `balance_test_on` + `n_test_candidates` — draw 200 equally-valid whole-region test sets
#    at the same target fraction and keep the one whose joint `year x label` composition is
#    closest to trainval's. splits.py never read `year`, and titling swept region by region,
#    so a purely spatial draw is also a temporal draw: Piura's locked test came out 48.3 %
#    label-year 1998 against trainval's 32.9 %. That interacts with the 1997-98 El Nino and
#    with the year-label confound (1998: 0.4 % perennial; 2000: 33.8 %). Cost is one extra
#    histogram per candidate; the achieved distance is written to splits_meta.json.

# ⚠️ This file is a DIFF against its parent, resolved by `crop_classifier.config_loader`.
# Read the parent for anything not listed below.

extends: split_allperu.yaml

# Keys this variant sets for itself; each REPLACES the parent's.
balance_test_on:
- year
- label
n_test_candidates: 200
